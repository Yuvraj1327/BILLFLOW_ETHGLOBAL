name: billflow
description: NEXA BILLFLOW - USDT invoice payments and invoice financing on Whitechain Sepolia.
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"   # CardThemeData / Color.withValues need Flutter 3.27+

# NOTE: version constraints below were written WITHOUT access to pub.dev (the build sandbox blocks it).
# Run `flutter pub get`; if resolution complains, relax the caret ranges. They are the only unverified part of this file.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  file_picker: ^8.0.6
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  intl: ^0.19.0
  image: ">=4.5.0 <4.10.0"
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - .env   # PUBLIC client configuration only (bundled into the app, readable by anyone who installs it)
